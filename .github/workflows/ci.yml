name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run tests
        run: python3 -m unittest test_app.py -v

  docker:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DH_THARUNDEVOPS }}
          password: ${{ secrets.DH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: tharundevops/qaz:latest

  deploy:
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/qaz \
            qaz=tharundevops/qaz:latest \
            -n dropfisher

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/qaz -n dropfisher
